<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

<defs>
  <!-- Background Tile -->
  <linearGradient id="tile-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1E2024" />
    <stop offset="50%" stop-color="#111215" />
    <stop offset="100%" stop-color="#08080A" />
  </linearGradient>
  <linearGradient id="tile-rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
    <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
  </linearGradient>

  <!-- Asphalt Roadbed Gradient -->
  <linearGradient id="asphalt-day" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#363A42" />
    <stop offset="40%" stop-color="#24272F" />
    <stop offset="100%" stop-color="#16181D" />
  </linearGradient>

  <!-- Yellow Highway Line -->
  <linearGradient id="hw-yellow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FEF08A" />
    <stop offset="30%" stop-color="#FACC15" />
    <stop offset="70%" stop-color="#EAB308" />
    <stop offset="100%" stop-color="#CA8A04" />
  </linearGradient>

  <!-- Gantry Sign Gradients -->
  <linearGradient id="sign-blue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0284C7" />
    <stop offset="100%" stop-color="#075985" />
  </linearGradient>
  <linearGradient id="sign-orange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" />
    <stop offset="100%" stop-color="#C2410C" />
  </linearGradient>
  <linearGradient id="sign-green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10B981" />
    <stop offset="100%" stop-color="#065F46" />
  </linearGradient>
  <linearGradient id="sign-purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8B5CF6" />
    <stop offset="100%" stop-color="#5B21B6" />
  </linearGradient>

  <linearGradient id="gantry-steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#94A3B8" />
    <stop offset="40%" stop-color="#475569" />
    <stop offset="100%" stop-color="#1E293B" />
  </linearGradient>

  <!-- Shadows & Glows -->
  <filter id="road-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
  </filter>
  <filter id="gantry-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
  </filter>
  <filter id="light-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#0A0B0E" />

  <g clip-path="url(#tile-clip)">
    <clipPath id="tile-clip">
      <rect x="32" y="32" width="448" height="448" rx="104" />
    </clipPath>

    <!-- Thin Roadside Verge / Grass at very edge -->
    <rect x="32" y="32" width="448" height="448" fill="#13231B" />

    <!-- ZOOMED-IN 4-LANE HIGHWAY BED (Fills from x=40 to x=472) -->
    <rect x="40" y="0" width="432" height="512" fill="url(#asphalt-day)" filter="url(#road-shadow)" />

    <!-- Left & Right Paved Shoulders -->
    <rect x="40" y="0" width="20" height="512" fill="#1F232B" />
    <rect x="452" y="0" width="20" height="512" fill="#1F232B" />

    <!-- Solid Outer Fog Lines (Heavy White, width 8px) -->
    <line x1="60" y1="0" x2="60" y2="512" stroke="#FFFFFF" stroke-width="8" opacity="0.95" />
    <line x1="452" y1="0" x2="452" y2="512" stroke="#FFFFFF" stroke-width="8" opacity="0.95" />

    <!-- Lane 1-2 Divider (Dashed White, width 6px) -->
    <line x1="158" y1="0" x2="158" y2="512" stroke="#F8FAFC" stroke-width="6" stroke-dasharray="32 26" opacity="0.9" />

    <!-- Center Double-Yellow Median (Separating northbound/southbound pairs) -->
    <rect x="250" y="0" width="12" height="512" fill="#14161A" />
    <line x1="248" y1="0" x2="248" y2="512" stroke="url(#hw-yellow)" stroke-width="5" />
    <line x1="264" y1="0" x2="264" y2="512" stroke="url(#hw-yellow)" stroke-width="5" />

    <!-- Lane 3-4 Divider (Dashed White, width 6px) -->
    <line x1="354" y1="0" x2="354" y2="512" stroke="#F8FAFC" stroke-width="6" stroke-dasharray="32 26" opacity="0.9" />

    <!-- Large Road Stencil Arrows on Asphalt -->
    <!-- Lane 1 Arrow -->
    <g transform="translate(109, 360)" fill="#FFFFFF" opacity="0.85">
      <path d="M 0 0 L -10 20 L -3.5 20 L -3.5 46 L 3.5 46 L 3.5 20 L 10 20 Z" />
    </g>
    <!-- Lane 2: Moving Vehicle / Link Capsule -->
    <g transform="translate(193, 220)" filter="url(#light-glow)">
      <!-- Sleek Link Capsule / Car -->
      <rect x="0" y="0" width="28" height="54" rx="9" fill="#0284C7" />
      <rect x="4" y="6" width="20" height="16" rx="4" fill="#38BDF8" />
      <!-- Headlight Beams forward -->
      <polygon points="6,0 -10,-45 12,-45 6,0" fill="#38BDF8" opacity="0.3" />
      <polygon points="22,0 16,-45 38,-45 22,0" fill="#38BDF8" opacity="0.3" />
      <circle cx="6" cy="3" r="3.5" fill="#FFFFFF" />
      <circle cx="22" cy="3" r="3.5" fill="#FFFFFF" />
      <!-- Speed trail backwards -->
      <line x1="14" y1="54" x2="14" y2="100" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    </g>
    <!-- Lane 3 Arrow -->
    <g transform="translate(305, 330)" fill="#FFFFFF" opacity="0.85">
      <path d="M 0 0 L -10 20 L -3.5 20 L -3.5 46 L 3.5 46 L 3.5 20 L 10 20 Z" />
    </g>
    <!-- Lane 4 Arrow -->
    <g transform="translate(403, 370)" fill="#FFFFFF" opacity="0.85">
      <path d="M 0 0 L -10 20 L -3.5 20 L -3.5 46 L 3.5 46 L 3.5 20 L 10 20 Z" />
    </g>

    <!-- BIG OVERHEAD HIGHWAY SIGN GANTRY (Spanning the entire road at y=50..140) -->
    <g filter="url(#gantry-shadow)">
      <!-- Gantry Steel Pillars on outer shoulders -->
      <rect x="36" y="58" width="16" height="32" rx="3" fill="url(#gantry-steel)" />
      <rect x="460" y="58" width="16" height="32" rx="3" fill="url(#gantry-steel)" />
      <!-- Steel Truss Beams Spanning Road -->
      <rect x="32" y="52" width="448" height="14" rx="2" fill="url(#gantry-steel)" />
      <rect x="32" y="128" width="448" height="10" rx="2" fill="url(#gantry-steel)" />
      <!-- Truss cross braces -->
      <line x1="60" y1="52" x2="80" y2="128" stroke="#334155" stroke-width="2.5" />
      <line x1="150" y1="52" x2="170" y2="128" stroke="#334155" stroke-width="2.5" />
      <line x1="245" y1="52" x2="265" y2="128" stroke="#334155" stroke-width="2.5" />
      <line x1="345" y1="52" x2="365" y2="128" stroke="#334155" stroke-width="2.5" />
      <line x1="435" y1="52" x2="455" y2="128" stroke="#334155" stroke-width="2.5" />

      <!-- 4 LARGE OVERHEAD HIGHWAY SIGNS (Width 82px, Height 64px each!) -->
      
      <!-- SIGN 1: SAFARI / ZEN (Blue Highway Sign, centered at x=109) -->
      <!-- x = 68 to 150 -->
      <g transform="translate(68, 62)">
        <rect x="0" y="0" width="82" height="64" rx="6" fill="url(#sign-blue)" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Inner border line (classic interstate sign inset border) -->
        <rect x="3" y="3" width="76" height="58" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
        <!-- Big Bold Safari Compass Glyph -->
        <circle cx="41" cy="27" r="15" fill="none" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="41" cy="27" r="3" fill="#FFFFFF" />
        <!-- Compass Needles -->
        <polygon points="41,15 46,27 41,39 36,27" fill="#FFFFFF" />
        <polygon points="41,15 44,27 41,39" fill="#EF4444" />
        <!-- Down Arrow below symbol -->
        <path d="M 41 55 L 36 48 L 46 48 Z" fill="#FFFFFF" />
      </g>

      <!-- SIGN 2: FIREFOX (Orange Highway Sign, centered at x=207) -->
      <!-- x = 166 to 248 -->
      <g transform="translate(166, 62)">
        <rect x="0" y="0" width="82" height="64" rx="6" fill="url(#sign-orange)" stroke="#FFFFFF" stroke-width="2.5" />
        <rect x="3" y="3" width="76" height="58" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
        <!-- Big Bold Flame Glyph -->
        <path d="M 41 12 C 36 18 31 22 31 28 C 31 34 35.5 38 41 38 C 46.5 38 51 34 51 28 C 51 22 46 18 41 12 Z" fill="#FFFFFF" />
        <path d="M 41 21 C 38 24 36 27 36 30 C 36 33 38 35 41 35 C 44 35 46 33 46 30 C 46 27 44 24 41 21 Z" fill="#FEF08A" />
        <!-- Down Arrow below symbol -->
        <path d="M 41 55 L 36 48 L 46 48 Z" fill="#FFFFFF" />
      </g>

      <!-- SIGN 3: CHROME (Green Interstate Sign, centered at x=305) -->
      <!-- x = 264 to 346 -->
      <g transform="translate(264, 62)">
        <rect x="0" y="0" width="82" height="64" rx="6" fill="url(#sign-green)" stroke="#FFFFFF" stroke-width="2.5" />
        <rect x="3" y="3" width="76" height="58" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
        <!-- Big Bold Chrome Tricolor / Disc Glyph -->
        <circle cx="41" cy="27" r="15" fill="none" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="41" cy="27" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
        <!-- 3 radial segment markers -->
        <line x1="41" y1="12" x2="48" y2="23" stroke="#FFFFFF" stroke-width="2.5" />
        <line x1="53" y1="34" x2="43" y2="33" stroke="#FFFFFF" stroke-width="2.5" />
        <line x1="29" y1="34" x2="36" y2="24" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Down Arrow below symbol -->
        <path d="M 41 55 L 36 48 L 46 48 Z" fill="#FFFFFF" />
      </g>

      <!-- SIGN 4: BRAVE / TOR (Purple Highway Sign, centered at x=403) -->
      <!-- x = 362 to 444 -->
      <g transform="translate(362, 62)">
        <rect x="0" y="0" width="82" height="64" rx="6" fill="url(#sign-purple)" stroke="#FFFFFF" stroke-width="2.5" />
        <rect x="3" y="3" width="76" height="58" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6" />
        <!-- Big Bold Privacy Shield Glyph -->
        <path d="M 41 13 L 53 17 L 53 28 C 53 34 41 39 41 39 C 41 39 29 34 29 28 L 29 17 Z" fill="#FFFFFF" />
        <path d="M 41 17 L 49 20 L 49 27 C 49 31 41 35 41 35 C 41 35 33 31 33 27 L 33 20 Z" fill="#5B21B6" />
        <path d="M 38 26 L 40 28 L 44 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Down Arrow below symbol -->
        <path d="M 41 55 L 36 48 L 46 48 Z" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <!-- Tile Rim Bevel -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#tile-rim)" stroke-width="2" />
</svg>