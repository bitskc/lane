# Triggered by annotated tags vX.Y.Z after the version bump documented in docs/RELEASING.md.
name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  package:
    # Builds and tests Lane on each Linux architecture and packs the install
    # tree (packaging/linux/build-tarball.sh). Fedora is the build base because
    # its Qt 6 and KDE Frameworks meet the CMake minimums on both x86_64 and
    # aarch64, which Ubuntu's runner images do not. aarch64 builds natively on
    # GitHub's Arm runner. The release job waits for every entry, so a failed
    # build or test never publishes a partial release.
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y $(cat packaging/linux/fedora-build-deps.txt)
      - name: Build, test, and package
        env:
          LANE_ARCH: ${{ matrix.arch }}
        run: |
          LANE_VERSION="${GITHUB_REF_NAME#v}" packaging/linux/build-tarball.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: lane-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lane-linux-*
          merge-multiple: true
          path: dist
      - name: Extract changelog section
        id: notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ -f CHANGELOG.md ]]; then
            body=$(awk -v ver="$tag" '
              BEGIN { found=0 }
              /^## \[?[0-9]/ {
                if (found) exit
                line=$0
                gsub(/^## \[?/, "", line)
                gsub(/\].*$/, "", line)
                gsub(/^## /, "", line)
                if (line == ver) found=1
                next
              }
              found && /^\[/ { exit }
              found { print }
            ' CHANGELOG.md)
            if [[ -n "${body//[[:space:]]/}" ]]; then
              {
                echo "body<<EOF"
                echo "$body"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "use_changelog=true" >> "$GITHUB_OUTPUT"
            else
              echo "use_changelog=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "use_changelog=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          body: ${{ steps.notes.outputs.use_changelog == 'true' && steps.notes.outputs.body || '' }}
          generate_release_notes: ${{ steps.notes.outputs.use_changelog != 'true' }}
          draft: false
          prerelease: false
