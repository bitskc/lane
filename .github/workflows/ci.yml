name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm && pacman -S --noconfirm git
      - uses: actions/checkout@v4
      - name: Reject merge-conflict markers
        run: |
          # Scan agent-edited source and docs only; skip review/design prose and
          # this workflow file (which documents the patterns it searches for).
          if git grep -nE '^(<{7}|>{7}|={7})|conflict://|unresolved conflict detected' -- \
            CHANGELOG.md README.md AGENTS.md CONTRIBUTING.md DESIGN.md COMMERCIAL.md LICENSE \
            src/ packaging/ data/ tests/ docs/config.schema.json; then
            echo "Tracked files contain merge-conflict markers or agent conflict-tool output"
            exit 1
          fi
      - name: Reject leaked tool-artifact text
        run: |
          # Agent sessions occasionally paste a tool's own pagination
          # footer or artifact reference straight into a file instead of
          # its actual content (e.g. a `read` truncation footer landing
          # in a doc). Skip this workflow file (which documents the
          # patterns it searches for) and docs/reviews/ (which
          # legitimately quotes tool output verbatim as review evidence).
          if git grep -nE '\[Showing lines [0-9]+-[0-9]+ of [0-9]+\.|Use :[0-9]+ to continue|artifact://' -- \
            ':!.github/workflows/ci.yml' ':!docs/reviews/'; then
            echo "Tracked files contain leaked tool-artifact text (paste debris from an agent session)"
            exit 1
          fi
      - name: Check tracked files end with a newline
        run: |
          # A missing trailing newline is usually the same class of
          # mistake as the artifact check above: a file written by a tool
          # that truncated mid-output. Skip binary files (grep -I treats
          # them as non-matching) and empty files (no trailing newline to
          # have).
          missing=0
          while IFS= read -r -d '' f; do
            [ -s "$f" ] || continue
            grep -Iq '' -- "$f" 2>/dev/null || continue
            if [ "$(tail -c1 -- "$f" | wc -l)" -ne 1 ]; then
              echo "Missing trailing newline: $f"
              missing=1
            fi
          done < <(git ls-files -z)
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed \
            base-devel cmake extra-cmake-modules ninja \
            qt6-base qt6-declarative qt6-svg \
            kirigami kirigami-addons ki18n kcoreaddons kconfig \
            kdbusaddons knotifications kwindowsystem kiconthemes kcolorscheme \
            kstatusnotifieritem kcrash layer-shell-qt qqc2-desktop-style \
            appstream
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Install to a throwaway prefix
        # appstreamtest (registered by ECM's KDECMakeSettings when
        # appstreamcli is found) reads build/install_manifest.txt and
        # checks each listed metainfo file with QFile::exists-style logic
        # against the *exact* paths recorded there, so this must be a real
        # --prefix install (whose manifest records that prefix), not a
        # DESTDIR install (whose manifest still records the undecorated
        # system paths, which then don't exist and the test silently
        # no-ops instead of validating anything). The prefix lives inside
        # build/ and is discarded with the rest of it.
        run: cmake --install build --prefix build/throwaway-install
      - name: Test
        run: ctest --test-dir build --output-on-failure
